[package]
name = "doggercom"
description = "doggercom: dogcom implementation in Rust."
authors = ["e792a8"]
version = "0.1.3"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "doggercom"

[dependencies]
anyhow = "1.0.89"
bstr = "1.10.0"
clap = { version = "4.5.18", features = ["derive"] }
digest = "0.10.7"
log = "0.4.22"
md-5 = "0.10.6"
md4 = "0.10.2"
rand = "0.9.1"
sha1 = "0.10.6"
simplelog = "0.12.2"

[target.'cfg(not(windows))'.dependencies]
daemonize = "0.5.0"
